name: DateTime Stamp

on:
  schedule:
    # Runs once every hour (UTC). Note: GitHub may delay scheduled runs under load.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datetime-stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create datetime stamp file
        run: |
          mkdir -p DateTimeStamps
          STAMP="$(date -u '+%Y-%m-%dT%H-%M-%SZ')"
          FILE="DateTimeStamps/${STAMP}.txt"
          echo "Generated at ${STAMP} (UTC)" > "$FILE"
          echo "Created $FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DateTimeStamps
          git commit -m "Add datetime stamp $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Rebase onto latest remote and retry to survive concurrent runs.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
